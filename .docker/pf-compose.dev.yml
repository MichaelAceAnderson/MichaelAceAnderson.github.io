services:
  pf-php-s:
    container_name: "pf-php-c"
    build:
      context: ../
      dockerfile: ".docker/php/Dockerfile.dev"
    env_file:
      - "php/.env.dev"
    restart: always
    volumes:
      - type: bind
        source: "../app/"
        target: "/var/www/html/"
        consistency: consistent
      - type: bind
        source: "php/logs/"
        target: "/var/log/php/"
        consistency: consistent
    ports:
      - "9000:9000"
    networks:
      - pf-network

  pf-nginx-s:
    container_name: "pf-nginx-c"
    build:
      context: ../
      dockerfile: ".docker/nginx/Dockerfile.dev"
    env_file:
      - "nginx/.env.dev"
    restart: always
    volumes:
      - type: bind
        source: "../app/"
        target: "/var/www/html/"
        consistency: consistent
      - type: bind
        source: "nginx/logs/"
        target: "/var/log/nginx/"
        consistency: consistent
    ports:
      - "80:80"
    networks:
      - pf-network
    depends_on:
      - pf-php-s

networks:
  pf-network:
    driver: bridge
