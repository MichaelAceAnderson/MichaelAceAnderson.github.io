<div class="taskbar">
	<start-menu *ngIf="appManager.startMenuOpen" (close)="appManager.startMenuOpen = false"></start-menu>
	<span class="taskbar-start-icon">
		<win-logo />
	</span>
	<span *ngFor="let app of appManager.appList">
		<pinned-app [app]="app"
			(click)="app.isOpened ? app.toggleMinimized() : app.open()"/>
	</span>
</div>
