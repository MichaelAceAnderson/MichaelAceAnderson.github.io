name: Deployer sur GitHub Pages

on:
  push:
    branches: 
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire le site final
        run: |
          cd app
          npm install
          npm run build

      - name: Upload 
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist/portfolio-ng/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4